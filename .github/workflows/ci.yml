name: CI

on:
  pull_request:
  push:
    branches: [master]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # 所有 lint 規則集中喺 .shellcheckrc 同 lint.sh，本機／CI 跑同一份。
      - name: 安裝 shellcheck
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq shellcheck
          shellcheck --version | head -2

      - name: lint（語法 + shellcheck + 結構規則）
        run: ./lint.sh --strict

  idempotency:
    name: idempotency（sandbox HOME）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # 腳本對象係 Arch/Omarchy 機器。Runner 冇 paru/pacman/hyprctl，所以全部
      # 特權同系統二進位都換成 no-op stub：唔會裝任何嘢，亦唔會觸碰 runner。
      - name: stub 特權／系統二進位
        run: |
          set -euo pipefail
          for b in sudo pacman paru yay hyprctl systemctl fcitx5 fcitx5-remote dbus-send \
                   killall pgrep wl-copy notify-send \
                   fc-cache fc-match gsettings; do
            printf '#!/bin/bash\nexit 0\n' | sudo tee "/usr/local/bin/$b" >/dev/null
            sudo chmod +x "/usr/local/bin/$b"
          done
          # fc-list 假裝兩個字體已安裝：唔會觸發下載，fontconfig 路徑仍然被覆蓋
          printf '#!/bin/bash\nprintf "OPPO Sans 4.0\\nMiSans VF\\n"\n' | sudo tee /usr/local/bin/fc-list >/dev/null
          sudo chmod +x /usr/local/bin/fc-list
          # tesseract 假裝 chi_tra 已安裝，令 OCR 快捷鍵路徑亦有覆蓋
          printf '#!/bin/bash\nprintf "List of available languages:\\nchi_tra\\n"\n' | sudo tee /usr/local/bin/tesseract >/dev/null
          sudo chmod +x /usr/local/bin/tesseract
          # curl 失敗而非 no-op：確保測試永遠唔會連網下載字體，亦唔會攞到空 zip
          printf '#!/bin/bash\nexit 6\n' | sudo tee /usr/local/bin/curl >/dev/null
          sudo chmod +x /usr/local/bin/curl

      - name: 冪等性全跑
        run: |
          set -euo pipefail
          export HOME="$(mktemp -d)"
          echo "sandbox HOME=$HOME"
          ./test-idempotency.sh